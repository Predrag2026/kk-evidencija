n></select></div><div class="field-wrap"><label class="field-label">Kontakt roditelja</label><input class="input-field" id="f-tel" type="text"/></div><div class="field-wrap"><label class="field-label">Porodica *</label><select class="input-field" id="f-porodica" onchange="onPorodicaChange()"></select></div><div id="nova-box" class="nova-box" style="display:none"><div style="color:#64748b;font-size:11px;font-weight:600;text-transform:uppercase;margin-bottom:11px">Nova porodica</div><div class="field-wrap"><label class="field-label">Prezime</label><input class="input-field" id="f-prezime" type="text" oninput="updatePrev()"/></div><div class="field-wrap"><label class="field-label">Ime roditelja</label><input class="input-field" id="f-imerod" type="text" oninput="updatePrev()"/></div><div id="nova-hint" style="color:#64748b;font-size:12px;margin-top:-4px"></div></div><div id="price-prev" style="display:none" class="price-prev"><div><div id="pr-red" style="font-size:11px;font-weight:600;text-transform:uppercase;color:#94a3b8"></div><div id="pr-note" style="font-size:12px;color:#cbd5e1;margin-top:2px"></div></div><div id="pr-val" style="font-family:'Outfit',sans-serif;font-weight:800;font-size:19px"></div></div><button class="main-btn btn-orange" id="modal-clan-btn" onclick="sacuvajClana()">Dodaj člana</button></div></div><div id="modal-uplata" class="overlay"><div class="modal"><div class="modal-header"><span class="modal-title" id="modal-uplata-title">Uplata</span><button class="close-btn" onclick="closeModal('modal-uplata')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div style="background:#0d948818;border:1px solid #0d948844;border-radius:10px;padding:12px 14px;margin-bottom:14px"><div style="color:#64748b;font-size:11px;font-weight:600;text-transform:uppercase;margin-bottom:3px">Preporučeni iznos</div><div id="uplata-rec" style="color:#0d9488;font-size:20px;font-weight:800;font-family:'Outfit',sans-serif"></div><div style="color:#475569;font-size:11px;margin-top:2px">Zbir mesečnih iznosa sve dece</div></div><div class="field-wrap"><label class="field-label">Iznos (RSD) *</label><input class="input-field" id="u-iznos" type="number"/></div><div class="field-wrap"><label class="field-label">Datum</label><input class="input-field" id="u-datum" type="date"/></div><div class="field-wrap"><label class="field-label">Napomena</label><input class="input-field" id="u-napomena" type="text"/></div><button class="main-btn btn-teal" onclick="sacuvajUplatu()">Zabeleži uplatu</button></div></div><div id="toast" class="toast"></div><script>const SUPA_URL="https://bhelrnjbxfhvpidxlebi.supabase.co";const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJoZWxybmpieGZodnBpZHhsZWJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNTY1NjEsImV4cCI6MjA5MDYzMjU2MX0.yY8REVGgMDvLYV9LTt9q0td5bApCJuPhIhR8GIuQGig";async function supa(path,opts={}){const res=await fetch(SUPA_URL+"/rest/v1/"+path,{headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":opts.prefer||"return=representation",...opts.headers},method:opts.method||"GET",body:opts.body?JSON.stringify(opts.body):undefined});const txt=await res.text();if(!res.ok){let msg=txt;try{const j=JSON.parse(txt);msg=j.message||j.hint||j.details||txt;}catch(e){}throw new Error(msg);}return txt?JSON.parse(txt):[];}const KATEGORIJE=["U8/Minibasket","U10","U12","U14"];const CLANARINA={1:3200,2:2400};const MESECI=["Jan","Feb","Mar","Apr","Maj","Jun","Jul","Avg","Sep","Okt","Nov","Dec"];let porodice=[],clanovi=[],uplate=[],currentPage="dashboard",filterKat="Sve",searchStr="",editingId=null,uplataPorodicaId=null,saving=false;function getClanarina(n){return n>=3?0:(CLANARINA[n]??0);}function getBrojDece(pid,izuzmiId=null){return clanovi.filter(c=>c.porodica_id===pid&&c.id!==izuzmiId).length;}function slugify(s){return(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"dj").replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,"");}function fmt(n){return(n??0).toLocaleString("sr-RS")+" RSD";}function todayStr(){return new Date().toISOString().split("T")[0];}function getDanasDo(pid){const u=uplate.filter(x=>x.porodica_id===pid);if(!u.length)return 999;const s=[...u].sort((a,b)=>new Date(b.datum)-new Date(a.datum));return Math.floor((new Date()-new Date(s[0].datum))/86400000);}function getStatus(d){if(d<=20)return{cls:"badge-green",label:"Aktivno"};if(d<=35)return{cls:"badge-yellow",label:"Upozorenje"};return{cls:"badge-red",label:"Dospelo"};}function getNazivP(pid){return(porodice.find(x=>x.id===pid)||{naziv:pid}).naziv;}function getUkupnoP(pid){return clanovi.filter(c=>c.porodica_id===pid).reduce((s,c)=>s+c.iznos,0);}function getDecaP(pid){return clanovi.filter(c=>c.porodica_id===pid);}function getZadnja(pid){const u=uplate.filter(x=>x.porodica_id===pid);if(!u.length)return null;return[...u].sort((a,b)=>new Date(b.datum)-new Date(a.datum))[0];}function toast(msg,type="ok"){const t=document.getElementById("toast");t.textContent=msg;t.className="toast show "+(type==="ok"?"ok":"err");setTimeout(()=>t.className="toast",3000);}function setSync(s){const d=document.getElementById("sync-dot");d.className="sync-dot"+(s==="loading"?" loading":s==="err"?" err":"");}async function loadAll(){setSync("loading");try{[porodice,clanovi,uplate]=await Promise.all([supa("porodice?order=naziv"),supa("clanovi?order=ime"),supa("uplate?order=datum.desc")]);setSync("ok");}catch(e){setSync("err");toast("Greška konekcije","err");}render();}function goTo(page){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));document.getElementById("page-"+page).classList.add("active");document.querySelectorAll(".nav-btn")[["dashboard","clanovi","uplate","projekcije"].indexOf(page)].classList.add("active");currentPage=page;render();}function openModal(id){document.getElementById(id).classList.add("open");}function closeModal(id){document.getElementById(id).classList.remove("open");editingId=null;}function svg(name,color,size=20){const s=`width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`;const i={users:`<svg ${s}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,payment:`<svg ${s}><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>`,chart:`<svg ${s}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>`,alert:`<svg ${s}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,plus:`<svg ${s} stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,trash:`<svg ${s}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,edit:`<svg ${s}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,search:`<svg ${s}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,trend:`<svg ${s}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,family:`<svg ${s}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`};return i[name]||"";}function statCard(icon,label,val,sub,accent){return`<div class="card"><div class="card-accent" style="background:${accent}"></div><div class="card-icon" style="background:${accent}22">${svg(icon,accent,15)}</div><span class="card-label">${label}</span><div class="card-val">${val}</div>${sub?`<div class="card-sub">${sub}</div>`:""}</div>`;}function loading(){return`<div class="loading-screen"><div class="spinner"></div><div style="color:#64748b;font-size:14px">Učitavanje...</div></div>`;}function renderDashboard(){const d=new Date();const m=d.getMonth(),g=d.getFullYear();const pM=uplate.filter(u=>{const dd=new Date(u.datum);return dd.getMonth()===m&&dd.getFullYear()===g;}).reduce((s,u)=>s+u.iznos,0);const uk=uplate.reduce((s,u)=>s+u.iznos,0);const pids=[...new Set(clanovi.map(c=>c.porodica_id))];const dosp=pids.filter(p=>getDanasDo(p)>35);const upoz=pids.filter(p=>{const dd=getDanasDo(p);return dd>20&&dd<=35;});const prM=clanovi.filter(c=>c.tip==="mesecna").reduce((s,c)=>s+c.iznos,0);if(!clanovi.length){document.getElementById("page-dashboard").innerHTML=`<div style="margin-bottom:22px"><h2 style="color:#f1f5f9;font-size:22px;font-family:'Outfit',sans-serif;font-weight:700">Pregled kluba</h2><p style="color:#64748b;font-size:13px;margin-top:3px">${MESECI[m]} ${g}</p></div><div style="text-align:center;padding:60px 20px;color:#475569"><div style="font-size:48px;margin-bottom:16px">🏀</div><div style="font-size:16px;font-weight:600;color:#64748b;margin-bottom:8px">Klub je prazan</div><div style="font-size:13px">Dodaj prve članove u tabu Članovi</div></div>`;return;}let html=`<div style="margin-bottom:22px"><h2 style="color:#f1f5f9;font-size:22px;font-family:'Outfit',sans-serif;font-weight:700">Pregled kluba</h2><p style="color:#64748b;font-size:13px;margin-top:3px">${MESECI[m]} ${g}</p></div><div class="grid2">${statCard("users","Ukupno članova",clanovi.length,pids.length+" porodica","#3b82f6")}${statCard("payment","Prihod ovog mes.",Math.round(pM/1000)+"k RSD","","#e85d26")}${statCard("alert","Upozorenje",upoz.length,"porodica 21-35 dana","#f59e0b")}${statCard("trend","Proj. mesečno",Math.round(prM/1000)+"k RSD","","#0d9488")}</div>`;if(dosp.length){html+=`<div class="dospelo-box"><div style="display:flex;align-items:center;gap:7px;margin-bottom:11px">${svg("alert","#dc2626",14)}<span style="color:#dc2626;font-weight:700;font-size:11px;text-transform:uppercase">Dospele uplate</span></div>`;dosp.forEach(pid=>{const deca=getDecaP(pid);const ukp=getUkupnoP(pid);const dana=getDanasDo(pid);html+=`<div class="row-sep"><div><div style="color:#e2e8f0;font-size:14px;font-weight:600">${getNazivP(pid)}</div><div style="color:#64748b;font-size:12px">${deca.length} ${deca.length===1?"dete":"dece"} · ${fmt(ukp)}/mes</div></div><span class="badge badge-red">${dana} dana</span></div>`;});html+=`</div>`;}html+=`<div class="section"><div class="section-title">Prihodi po kategoriji</div>`;KATEGORIJE.forEach(k=>{const cK=clanovi.filter(c=>c.kategorija===k);const pr=cK.reduce((s,c)=>s+(c.tip==="mesecna"?c.iznos:c.iznos/12),0);html+=`<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="color:#e2e8f0;font-size:13px">${k} <span style="color:#64748b">(${cK.length})</span></span><span style="color:#e85d26;font-size:13px;font-weight:600">${fmt(Math.round(pr))}</span></div><div class="bar-wrap"><div class="bar" style="width:${Math.min(100,(pr/5000)*100)}%"></div></div></div>`;});html+=`<div style="border-top:1px solid #2d3650;padding-top:11px;display:flex;justify-content:space-between"><span style="color:#94a3b8;font-size:13px">Ukupan prihod</span><span style="color:#f1f5f9;font-size:14px;font-weight:700">${fmt(uk)}</span></div></div>`;document.getElementById("page-dashboard").innerHTML=html;}function renderClanovi(){const filtered=clanovi.filter(c=>{const ms=c.ime.toLowerCase().includes(searchStr.toLowerCase())||getNazivP(c.porodica_id).toLowerCase().includes(searchStr.toLowerCase());return ms&&(filterKat==="Sve"||c.kategorija===filterKat);});let html=`<div class="page-header"><h2 class="page-title">Članovi</h2><button class="add-btn" onclick="openDodaj()">${svg("plus","#fff",14)} Dodaj</button></div><div class="search-wrap"><span class="search-icon">${svg("search","#64748b",14)}</span><input class="input-field search-input" type="text" placeholder="Ime ili porodica..." value="${searchStr.replace(/"/g,"&quot;")}" oninput="searchStr=this.value;renderClanovi()"/></div><div class="filter-row">${["Sve",...KATEGORIJE].map(k=>`<button class="filter-btn${filterKat===k?" active":""}" onclick="filterKat='${k}';renderClanovi()">${k}</button>`).join("")}</div>`;if(!filtered.length){html+=`<div class="empty">${clanovi.length?"Nema rezultata":"Nema članova. Dodaj prvog klikom na + Dodaj."}</div>`;}else{filtered.forEach(c=>{const dana=getDanasDo(c.porodica_id);const st=getStatus(dana);const rB=c.r_br===1?"badge-blue":c.r_br===2?"badge-amber":"badge-green";const rT=c.r_br===1?"1. dete":c.r_br===2?"2. dete":"3.+ dete";const z=getZadnja(c.porodica_id);const izS=c.iznos===0?`<span style="color:#0d9488;font-weight:700">Besplatno</span>`:fmt(c.iznos);html+=`<div class="member-card"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px"><span style="color:#f1f5f9;font-weight:700;font-size:15px">${c.ime}</span><span class="badge ${st.cls}">${st.label}</span><span class="badge ${rB}">${rT}</span></div><div style="color:#64748b;font-size:12px">${c.kategorija} · ${izS}</div><div style="color:#475569;font-size:11px;margin-top:2px">👨‍👩‍👦 ${getNazivP(c.porodica_id)}${c.tel?" · "+c.tel:""}</div>${z?`<div style="color:#334155;font-size:11px;margin-top:2px">Posl. uplata: ${z.datum} · ${fmt(z.iznos)}</div>`:""}</div><div class="btn-row"><button class="icon-btn icon-btn-green" onclick="openUplata('${c.porodica_id}')">${svg("payment","#0d9488",14)}</button><button class="icon-btn icon-btn-blue" onclick="openEdit(${c.id})">${svg("edit","#3b82f6",14)}</button><button class="icon-btn icon-btn-red" onclick="obrisiClana(${c.id})">${svg("trash","#dc2626",14)}</button></div></div></div>`;});}document.getElementById("page-clanovi").innerHTML=html;}function renderUplate(){let html=`<h2 class="page-title" style="margin-bottom:16px">Istorija uplata</h2>`;if(!uplate.length){html+=`<div class="empty">Nema evidentiranih uplata</div>`;}uplate.forEach(u=>{const deca=getDecaP(u.porodica_id);const imena=deca.map(d=>d.ime.split(" ")[0]).join(", ");html+=`<div class="member-card"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="flex:1"><div style="color:#f1f5f9;font-weight:700;font-size:14px">${getNazivP(u.porodica_id)}</div><div style="color:#64748b;font-size:12px;margin-top:2px">📅 ${u.datum}${u.napomena?" · "+u.napomena:""}</div>${imena?`<div style="color:#475569;font-size:11px;margin-top:2px">${imena}</div>`:""}</div><div style="display:flex;align-items:center;gap:8px;margin-left:8px"><span style="color:#0d9488;font-weight:700;font-size:14px;white-space:nowrap">+${fmt(u.iznos)}</span><button class="icon-btn icon-btn-red" onclick="obrisiUplatu(${u.id})">${svg("trash","#dc2626",13)}</button></div></div></div>`;});document.getElementById("page-uplate").innerHTML=html;}function renderProjekcije(){const danas=new Date();const mes=Array.from({length:6},(_,i)=>{const d=new Date(danas);d.setMonth(d.getMonth()-(5-i));const m=d.getMonth(),g=d.getFullYear();const t=uplate.filter(u=>{const ud=new Date(u.datum);return ud.getMonth()===m&&ud.getFullYear()===g;}).reduce((s,u)=>s+u.iznos,0);return{mesec:MESECI[m],iznos:t};});const maxI=Math.max(...mes.map(m=>m.iznos),1);const prM=clanovi.reduce((s,c)=>s+(c.tip==="mesecna"?c.iznos:c.iznos/12),0);const pids=[...new Set(clanovi.map(c=>c.porodica_id))];const akt=pids.filter(p=>getDanasDo(p)<=35).length;let html=`<h2 class="page-title" style="margin-bottom:16px">Projekcije prihoda</h2><div class="grid2">${statCard("trend","Proj. mesečno",Math.round(prM/1000)+"k RSD","","#e85d26")}${statCard("chart","Proj. godišnje",Math.round(prM*12/1000)+"k RSD","","#3b82f6")}${statCard("family","Aktivne porodice",akt,"od "+pids.length+" ukupno","#0d9488")}${statCard("payment","Naplata",Math.round((akt/Math.max(pids.length,1))*100)+"%","stepen","#f59e0b")}</div><div class="section"><div class="section-title">Prihodi - poslednjih 6 meseci</div><div style="display:flex;align-items:flex-end;gap:8px;height:100px">`;mes.forEach(m=>{const h=Math.round((m.iznos/maxI)*80);html+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="color:#64748b;font-size:10px">${m.iznos>0?Math.round(m.iznos/1000)+"k":""}</div><div style="width:100%;background:linear-gradient(180deg,#e85d26,#c2410c);border-radius:4px 4px 0 0;height:${h}px;min-height:${m.iznos>0?5:0}px"></div><div style="color:#64748b;font-size:10px">${m.mesec}</div></div>`;});html+=`</div></div><div class="section"><div class="section-title">Po kategoriji</div>`;KATEGORIJE.forEach(k=>{const cK=clanovi.filter(c=>c.kategorija===k);const aK=cK.filter(c=>getDanasDo(c.porodica_id)<=35);const pr=cK.reduce((s,c)=>s+(c.tip==="mesecna"?c.iznos:c.iznos/12),0);html+=`<div class="row-sep"><div><div style="color:#e2e8f0;font-size:14px;font-weight:600">${k}</div><div style="color:#64748b;font-size:12px">${aK.length}/${cK.length} aktivnih</div></div><div style="text-align:right"><div style="color:#e85d26;font-weight:700;font-size:13px">${fmt(Math.round(pr))}/mes</div><div style="color:#64748b;font-size:11px">${fmt(Math.round(pr*12))}/god</div></div></div>`;});html+=`</div>`;document.getElementById("page-projekcije").innerHTML=html;}function buildPorodicaSelect(sel){const s=document.getElementById("f-porodica");s.innerHTML=`<option value="">— Izaberi porodicu —</option>`;porodice.forEach(p=>{const br=clanovi.filter(c=>c.porodica_id===p.id).length;const o=document.createElement("option");o.value=p.id;o.textContent=`${p.naziv} (${br} ${br===1?"dete":"dece"})`;if(p.id===sel)o.selected=true;s.appendChild(o);});const n=document.createElement("option");n.value="__nova__";n.textContent="+ Nova porodica";s.appendChild(n);}function onPorodicaChange(){updatePrev();}function updatePrev(){const pid=document.getElementById("f-porodica").value;const nova=pid==="__nova__";document.getElementById("nova-box").style.display=nova?"block":"none";if(nova){const p=document.getElementById("f-prezime").value;const i=document.getElementById("f-imerod").value;document.getElementById("nova-hint").textContent=p&&i?`Prikazaće se kao: "${p} — ${i}"`:"";}const fPid=nova?slugify((document.getElementById("f-prezime").value||"")+"_"+(document.getElementById("f-imerod").value||"")):pid;const show=(pid&&pid!=="__nova__")||(nova&&document.getElementById("f-prezime").value&&document.getElementById("f-imerod").value);const prev=document.getElementById("price-prev");if(!show){prev.style.display="none";return;}const br=getBrojDece(fPid,editingId)+1;const iznos=getClanarina(br);const boja=iznos===0?"#0d9488":br===2?"#f59e0b":"#3b82f6";const bg=iznos===0?"#0d948818":br===2?"#f59e0b18":"#3b82f618";const bd=iznos===0?"#0d948844":br===2?"#f59e0b44":"#3b82f644";prev.style.display="flex";prev.style.background=bg;prev.style.border=`1px solid ${bd}`;document.getElementById("pr-red").textContent=br===1?"1. dete":br===2?"2. dete":`${br}. dete — besplatno`;document.getElementById("pr-note").textContent=br===1?"Puna cena":br===2?"Popust 25%":"Treće i više — bez naknade";document.getElementById("pr-val").style.color=boja;document.getElementById("pr-val").textContent=iznos===0?"Besplatno":`${iznos.toLocaleString("sr-RS")} RSD`;}function openDodaj(){editingId=null;document.getElementById("modal-clan-title").textContent="Novi član";document.getElementById("modal-clan-btn").textContent="Dodaj člana";document.getElementById("f-ime").value="";document.getElementById("f-datum").value="";document.getElementById("f-kat").value="U8/Minibasket";document.getElementById("f-tip").value="mesecna";document.getElementById("f-tel").value="";document.getElementById("f-prezime").value="";document.getElementById("f-imerod").value="";buildPorodicaSelect("");document.getElementById("nova-box").style.display="none";document.getElementById("price-prev").style.display="none";openModal("modal-clan");}function openEdit(id){const c=clanovi.find(x=>x.id===id);if(!c)return;editingId=id;document.getElementById("modal-clan-title").textContent="Uredi člana";document.getElementById("modal-clan-btn").textContent="Sačuvaj izmene";document.getElementById("f-ime").value=c.ime;document.getElementById("f-datum").value=c.datum_rodjenja||"";document.getElementById("f-kat").value=c.kategorija;document.getElementById("f-tip").value=c.tip;document.getElementById("f-tel").value=c.tel||"";buildPorodicaSelect(c.porodica_id);document.getElementById("nova-box").style.display="none";updatePrev();openModal("modal-clan");}async function sacuvajClana(){if(saving)return;const ime=document.getElementById("f-ime").value.trim();const datum=document.getElementById("f-datum").value;const kat=document.getElementById("f-kat").value;const tip=document.getElementById("f-tip").value;const tel=document.getElementById("f-tel").value.trim();const pidSel=document.getElementById("f-porodica").value;if(!ime||!pidSel){toast("Unesite ime i izaberite porodicu!","err");return;}saving=true;setSync("loading");try{let fPid=pidSel;if(pidSel==="__nova__"){const prez=document.getElementById("f-prezime").value.trim();const imed=document.getElementById("f-imerod").value.trim();if(!prez||!imed){toast("Unesite prezime i ime roditelja!","err");saving=false;return;}fPid=slugify(prez+"_"+imed);if(!porodice.find(p=>p.id===fPid)){const np=await supa("porodice",{method:"POST",body:{id:fPid,naziv:`${prez} — ${imed}`}});porodice.push(np[0]);}}const br=getBrojDece(fPid,editingId)+1;const iznos=getClanarina(br);const data={ime,datum_rodjenja:datum||null,kategorija:kat,tip,tel:tel||null,porodica_id:fPid,r_br:br,iznos};if(editingId){const upd=await supa(`clanovi?id=eq.${editingId}`,{method:"PATCH",body:data});const idx=clanovi.findIndex(c=>c.id===editingId);if(idx>-1)clanovi[idx]={...clanovi[idx],...upd[0]};toast("Član ažuriran ✓");}else{const nov=await supa("clanovi",{method:"POST",body:data});clanovi.push(nov[0]);clanovi.sort((a,b)=>a.ime.localeCompare(b.ime));toast("Član dodat ✓");}closeModal("modal-clan");setSync("ok");render();}catch(e){toast("Greška: "+(e.message||"").slice(0,80),"err");setSync("err");}saving=false;}async function obrisiClana(id){if(!confirm("Obrisati ovog člana?"))return;setSync("loading");try{await supa(`clanovi?id=eq.${id}`,{method:"DELETE",prefer:"return=minimal"});clanovi=clanovi.filter(c=>c.id!==id);toast("Član obrisan");setSync("ok");render();}catch(e){toast("Greška!","err");setSync("err");}}function openUplata(pid){uplataPorodicaId=pid;const uk=getUkupnoP(pid);document.getElementById("modal-uplata-title").textContent="Uplata — "+getNazivP(pid);document.getElementById("uplata-rec").textContent=fmt(uk);document.getElementById("u-iznos").value=uk;document.getElementById("u-datum").value=todayStr();document.getElementById("u-napomena").value="";openModal("modal-uplata");}async function sacuvajUplatu(){if(saving)return;const iznos=parseInt(document.getElementById("u-iznos").value);const datum=document.getElementById("u-datum").value;const nap=document.getElementById("u-napomena").value.trim();if(!iznos||!datum){toast("Unesite iznos i datum!","err");return;}saving=true;setSync("loading");try{const nov=await supa("uplate",{method:"POST",body:{porodica_id:uplataPorodicaId,datum,iznos,napomena:nap||null}});uplate.unshift(nov[0]);toast("Uplata zabeležena ✓");closeModal("modal-uplata");setSync("ok");render();}catch(e){toast("Greška!","err");setSync("err");}saving=false;}async function obrisiUplatu(id){if(!confirm("Obrisati ovu uplatu?"))return;setSync("loading");try{await supa(`uplate?id=eq.${id}`,{method:"DELETE",prefer:"return=minimal"});uplate=uplate.filter(u=>u.id!==id);toast("Uplata obrisana");setSync("ok");render();}catch(e){toast("Greška!","err");setSync("err");}}function render(){if(currentPage==="dashboard")renderDashboard();if(currentPage==="clanovi")renderClanovi();if(currentPage==="uplate")renderUplate();if(currentPage==="projekcije")renderProjekcije();}document.getElementById("page-dashboard").innerHTML=loading();loadAll();</script></body></html>
