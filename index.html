</style>

<script>
// ═══════════════════════════════════════════
// SUPABASE
// ═══════════════════════════════════════════
const SUPA_URL = "https://bhelrnjbxfhvpidxlebi.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJoZWxybmpieGZodnBpZHhsZWJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNTY1NjEsImV4cCI6MjA5MDYzMjU2MX0.yY8REVGgMDvLYV9LTt9q0td5bApCJuPhIhR8GIuQGig";

async function supa(path, opts={}) {
  const res = await fetch(SUPA_URL + "/rest/v1/" + path, {
    headers: {
      "apikey": SUPA_KEY,
      "Authorization": "Bearer " + SUPA_KEY,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=representation",
      ...opts.headers
    },
    method: opts.method || "GET",
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const txt = await res.text();
  if (!res.ok) {
    let msg = txt;
    try { const j=JSON.parse(txt); msg=j.message||j.hint||j.details||txt; } catch(e){}
    throw new Error(msg);
  }
  return txt ? JSON.parse(txt) : [];
}

// ═══════════════════════════════════════════
// KONSTANTE & HELPERS
// ═══════════════════════════════════════════
const KATEGORIJE = ["U8/Minibasket","U10","U12","U14"];
const CLANARINA  = {1:3200, 2:2400};
const MESECI_SR  = ["Januar","Februar","Mart","April","Maj","Jun","Jul","Avgust","Septembar","Oktobar","Novembar","Decembar"];
const MESECI_KR  = ["Jan","Feb","Mar","Apr","Maj","Jun","Jul","Avg","Sep","Okt","Nov","Dec"];

function getClanarina(n){ return n>=3?0:(CLANARINA[n]??0); }
function getBrojDece(pid, izuzmiId=null){ return clanovi.filter(c=>c.porodica_id===pid&&c.id!==izuzmiId).length; }
function slugify(s){ return(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"dj").replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,""); }
function fmt(n){ return(n??0).toLocaleString("sr-RS")+" RSD"; }
function todayStr(){ return new Date().toISOString().split("T")[0]; }
function getNazivP(pid){ return(porodice.find(x=>x.id===pid)||{naziv:pid}).naziv; }
function getUkupnoP(pid){ return clanovi.filter(c=>c.porodica_id===pid).reduce((s,c)=>s+c.iznos,0); }
function getDecaP(pid){ return clanovi.filter(c=>c.porodica_id===pid); }

// Vraca string "YYYY-MM" za godinu/mesec
function ym(year, month){ return year+"-"+String(month+1).padStart(2,"0"); }

// Svi meseci od datuma prvog treninga do tekuceg meseca (ukljucujuci oba)
function getMesecOd(datumTreninga){
  if(!datumTreninga) return [];
  const start = new Date(datumTreninga);
  const now = new Date();
  const result = [];
  let y = start.getFullYear(), m = start.getMonth();
  while(y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth())){
    result.push(ym(y,m));
    m++; if(m>11){m=0;y++;}
  }
  return result;
}

// Placeni meseci za porodicu (iz uplata)
function getPlaceniMeseci(pid){
  return uplate.filter(u=>u.porodica_id===pid&&u.za_mesec).map(u=>u.za_mesec);
}

// Status porodice: neplaceni meseci se racunaju po svakom detetu posebno
// Mesec se smatra dugovanim ako BILO KOJE dete duguje taj mesec
function getNeplaceniMeseci(pid){
  const deca = getDecaP(pid);
  if(!deca.length) return [];
  const placeni = getPlaceniMeseci(pid);

  // Skup svih meseci koje duguje bar jedno dete
  const dugSet = new Set();
  deca.forEach(dete => {
    if(!dete.datum_treninga) return;
    // Meseci od datuma treninga tog deteta do danas
    const meseciDeteta = getMesecOd(dete.datum_treninga);
    meseciDeteta.forEach(m => {
      if(!placeni.includes(m)) dugSet.add(m);
    });
  });

  return [...dugSet].sort();
}

function getStatus(pid){
  const nep = getNeplaceniMeseci(pid);
  if(!nep.length) return {cls:"badge-green", label:"Plaćeno"};
  if(nep.length===1) return {cls:"badge-yellow", label:"1 mes. dug"};
  return {cls:"badge-red", label:nep.length+" mes. dug"};
}

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let porodice=[], clanovi=[], uplate=[];
let currentPage="dashboard", filterKat="Sve", searchStr="";
let editingId=null, uplataPorodicaId=null, saving=false;

// ═══════════════════════════════════════════
// TOAST & SYNC
// ═══════════════════════════════════════════
function toast(msg,type="ok"){
  const t=document.getElementById("toast");
  t.textContent=msg; t.className="toast show "+(type==="ok"?"ok":"err");
  setTimeout(()=>t.className="toast",3000);
}
function setSync(s){
  const d=document.getElementById("sync-dot");
  d.className="sync-dot"+(s==="loading"?" loading":s==="err"?" err":"");
}

// ═══════════════════════════════════════════
// LOAD
// ═══════════════════════════════════════════
async function loadAll(){
  setSync("loading");
  try {
    [porodice,clanovi,uplate] = await Promise.all([
      supa("porodice?order=naziv"),
      supa("clanovi?order=ime"),
      supa("uplate?order=datum.desc")
    ]);
    setSync("ok");
  } catch(e){ setSync("err"); toast("Greška konekcije","err"); }
  render();
}

// ═══════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════
function goTo(page){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("page-"+page).classList.add("active");
  document.querySelectorAll(".nav-btn")[["dashboard","clanovi","uplate","projekcije"].indexOf(page)].classList.add("active");
  currentPage=page; render();
}

// ═══════════════════════════════════════════
// SVG
// ═══════════════════════════════════════════
function svg(name,color,size=20){
  const s=`width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`;
  const i={
    users:`<svg ${s}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
    payment:`<svg ${s}><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>`,
    chart:`<svg ${s}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>`,
    alert:`<svg ${s}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
    plus:`<svg ${s} stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
    trash:`<svg ${s}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
    edit:`<svg ${s}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
    search:`<svg ${s}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
    trend:`<svg ${s}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,
    family:`<svg ${s}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
    check:`<svg ${s} stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`
  };
  return i[name]||"";
}

function statCard(icon,label,val,sub,accent){
  return `<div class="card"><div class="card-accent" style="background:${accent}"></div>
    <div class="card-icon" style="background:${accent}22">${svg(icon,accent,15)}</div>
    <span class="card-label">${label}</span>
    <div class="card-val">${val}</div>
    ${sub?`<div class="card-sub">${sub}</div>`:""}</div>`;
}
function loading(){ return `<div class="loading-screen"><div class="spinner"></div><div style="color:#64748b;font-size:14px">Učitavanje...</div></div>`; }

function formatMesec(ym){
  if(!ym) return "";
  const [y,m]=ym.split("-");
  return MESECI_SR[parseInt(m)-1]+" "+y;
}

function renderProjekcije(){
  const danas=new Date();
  const mesecni=Array.from({length:6},(_,i)=>{
    const d=new Date(danas); d.setMonth(d.getMonth()-(5-i));
    const mesKljuc=ym(d.getFullYear(),d.getMonth());
    const total=uplate.filter(u=>u.za_mesec===mesKljuc).reduce((s,u)=>s+u.iznos,0);
    return {mesec:MESECI_KR[d.getMonth()],iznos:total};
  });
  const maxIz=Math.max(...mesecni.map(m=>m.iznos),1);
  const projM=clanovi.reduce((s,c)=>s+c.iznos,0);
  const pids=[...new Set(clanovi.map(c=>c.porodica_id))];
  const tekuciMesec=ym(danas.getFullYear(),danas.getMonth());
  const akt=pids.filter(pid=>!getNeplaceniMeseci(pid).includes(tekuciMesec)).length;

  let html=`<h2 class="page-title" style="margin-bottom:16px">Projekcije prihoda</h2>
  <div class="grid2">
    ${statCard("trend","Proj. mesečno",Math.round(projM/1000)+"k RSD","","#e85d26")}
    ${statCard("chart","Proj. godišnje",Math.round(projM*12/1000)+"k RSD","","#3b82f6")}
    ${statCard("family","Platile ovaj mes.",akt,"od "+pids.length+" porodica","#0d9488")}
    ${statCard("payment","Naplata",Math.round((akt/Math.max(pids.length,1))*100)+"%","stepen","#f59e0b")}
  </div>
  <div class="section">
    <div class="section-title">Naplaćeno — poslednjih 6 meseci</div>
    <div style="display:flex;align-items:flex-end;gap:8px;height:100px">`;
  mesecni.forEach(m=>{
    const h=Math.round((m.iznos/maxIz)*80);
    html+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="color:#64748b;font-size:10px">${m.iznos>0?Math.round(m.iznos/1000)+"k":""}</div>
      <div style="width:100%;background:linear-gradient(180deg,#e85d26,#c2410c);border-radius:4px 4px 0 0;height:${h}px;min-height:${m.iznos>0?5:0}px"></div>
      <div style="color:#64748b;font-size:10px">${m.mesec}</div>
    </div>`;
  });
  html+=`</div></div><div class="section"><div class="section-title">Po kategoriji</div>`;
  KATEGORIJE.forEach(k=>{
    const cK=clanovi.filter(c=>c.kategorija===k);
    const aktK=cK.filter(c=>!getNeplaceniMeseci(c.porodica_id).includes(tekuciMesec));
    const pr=cK.reduce((s,c)=>s+c.iznos,0);
    html+=`<div class="row-sep">
      <div><div style="color:#e2e8f0;font-size:14px;font-weight:600">${k}</div>
      <div style="color:#64748b;font-size:12px">${aktK.length}/${cK.length} platilo ovaj mes.</div></div>
      <div style="text-align:right">
        <div style="color:#e85d26;font-weight:700;font-size:13px">${fmt(pr)}/mes</div>
        <div style="color:#64748b;font-size:11px">${fmt(pr*12)}/god</div>
      </div>
    </div>`;
  });
  html+=`</div>`;
  document.getElementById("page-projekcije").innerHTML=html;
}

function buildPorodicaSelect(selId){
  const sel=document.getElementById("f-porodica");
  sel.innerHTML=`<option value="">— Izaberi porodicu —</option>`;
  porodice.forEach(p=>{
    const br=clanovi.filter(c=>c.porodica_id===p.id).length;
    const o=document.createElement("option");
    o.value=p.id; o.textContent=`${p.naziv} (${br} ${br===1?"dete":"dece"})`;
    if(p.id===selId) o.selected=true;
    sel.appendChild(o);
  });
  const n=document.createElement("option"); n.value="__nova__"; n.textContent="+ Nova porodica";
  sel.appendChild(n);
}

function onPorodicaChange(){ updatePrev(); }

function updatePrev(){
  const pid=document.getElementById("f-porodica").value;
  const nova=pid==="__nova__";
  document.getElementById("nova-box").style.display=nova?"block":"none";
  if(nova){
    const p=document.getElementById("f-prezime").value;
    const i=document.getElementById("f-imerod").value;
    document.getElementById("nova-hint").textContent=p&&i?`Prikazaće se kao: "${p} — ${i}"`:"";
  }
  const fPid=nova?slugify((document.getElementById("f-prezime").value||"")+"_"+(document.getElementById("f-imerod").value||"")):pid;
  const show=(pid&&pid!=="__nova__")||(nova&&document.getElementById("f-prezime").value&&document.getElementById("f-imerod").value);
  const prev=document.getElementById("price-prev");
  if(!show){prev.style.display="none";return;}
  const br=getBrojDece(fPid,editingId)+1;
  const iznos=getClanarina(br);
  const boja=iznos===0?"#0d9488":br===2?"#f59e0b":"#3b82f6";
  const bg=iznos===0?"#0d948818":br===2?"#f59e0b18":"#3b82f618";
  const bd=iznos===0?"#0d948844":br===2?"#f59e0b44":"#3b82f644";
  prev.style.display="flex"; prev.style.background=bg; prev.style.border=`1px solid ${bd}`;
  document.getElementById("pr-red").textContent=br===1?"1. dete":br===2?"2. dete":`${br}. dete — besplatno`;
  document.getElementById("pr-note").textContent=br===1?"Puna cena":br===2?"Popust 25%":"Treće i više — bez naknade";
  document.getElementById("pr-val").style.color=boja;
  document.getElementById("pr-val").textContent=iznos===0?"Besplatno":`${iznos.toLocaleString("sr-RS")} RSD`;
}

function openDodaj(){
  editingId=null;
  document.getElementById("modal-clan-title").textContent="Novi član";
  document.getElementById("modal-clan-btn").textContent="Dodaj člana";
  document.getElementById("f-ime").value="";
  document.getElementById("f-datum").value="";
  document.getElementById("f-trening").value=todayStr();
  document.getElementById("f-kat").value="U8/Minibasket";
  document.getElementById("f-tel").value="";
  document.getElementById("f-prezime").value="";
  document.getElementById("f-imerod").value="";
  buildPorodicaSelect("");

}

function openEdit(id){
  const c=clanovi.find(x=>x.id===id); if(!c) return;
  editingId=id;
  document.getElementById("modal-clan-title").textContent="Uredi člana";
  document.getElementById("modal-clan-btn").textContent="Sačuvaj izmene";
  document.getElementById("f-ime").value=c.ime;
  document.getElementById("f-datum").value=c.datum_rodjenja||"";
  document.getElementById("f-trening").value=c.datum_treninga||"";
  document.getElementById("f-kat").value=c.kategorija;
  document.getElementById("f-tel").value=c.tel||"";
  buildPorodicaSelect(c.porodica_id);
  document.getElementById("nova-box").style.display="none";
  updatePrev();
  openModal("modal-clan");
}

async function sacuvajClana(){
  if(saving) return;
  const ime=document.getElementById("f-ime").value.trim();
  const datum=document.getElementById("f-datum").value;
  const trening=document.getElementById("f-trening").value;
  const kat=document.getElementById("f-kat").value;
  const tel=document.getElementById("f-tel").value.trim();
  const pidSel=document.getElementById("f-porodica").value;
  if(!ime||!pidSel||!trening){toast("Unesite ime, datum treninga i porodicu!","err");return;}

  saving=true; setSync("loading");
  try {
    let fPid=pidSel;
    if(pidSel==="__nova__"){
      const prez=document.getElementById("f-prezime").value.trim();
      const imed=document.getElementById("f-imerod").value.trim();
      if(!prez||!imed){toast("Unesite prezime i ime roditelja!","err");saving=false;return;}
      fPid=slugify(prez+"_"+imed);
      if(!porodice.find(p=>p.id===fPid)){
        const np=await supa("porodice",{method:"POST",body:{id:fPid,naziv:`${prez} — ${imed}`}});
        porodice.push(np[0]);
      }
    }
    const br=getBrojDece(fPid,editingId)+1;
    const iznos=getClanarina(br);
    const data={ime,datum_rodjenja:datum||null,datum_treninga:trening,kategorija:kat,tel:tel||null,porodica_id:fPid,r_br:br,iznos};
    if(editingId){
      const upd=await supa(`clanovi?id=eq.${editingId}`,{method:"PATCH",body:data});
      const idx=clanovi.findIndex(c=>c.id===editingId);
      if(idx>-1) clanovi[idx]={...clanovi[idx],...upd[0]};
      toast("Član ažuriran ✓");
    } else {
      const nov=await supa("clanovi",{method:"POST",body:data});
      clanovi.push(nov[0]);
      clanovi.sort((a,b)=>a.ime.localeCompare(b.ime));
      toast("Član dodat ✓");
    }
    closeModal("modal-clan"); setSync("ok"); render();
  } catch(e){ toast("Greška: "+(e.message||"").slice(0,80),"err"); setSync("err"); }
  saving=false;
}

async function obrisiClana(id){
  if(!confirm("Obrisati ovog člana?")) return;
  setSync("loading");
  try {
    await supa(`clanovi?id=eq.${id}`,{method:"DELETE",prefer:"return=minimal"});
    clanovi=clanovi.filter(c=>c.id!==id);
    toast("Član obrisan"); setSync("ok"); render();
  } catch(e){ toast("Greška!","err"); setSync("err"); }
}

// ═══════════════════════════════════════════
// MODAL — UPLATA
// ═══════════════════════════════════════════
function buildMesecSelect(pid){
  const sel=document.getElementById("u-mesec");
  sel.innerHTML="";
  // Ponudi neplaćene mesece + tekuci mesec
  const nep=getNeplaceniMeseci(pid);
  const danas=new Date();
  const tekuci=ym(danas.getFullYear(),danas.getMonth());
  // Skup meseci za prikaz: neplaceni + tekuci (ako nije vec tu)
  const opcije=[...nep];
  if(!opcije.includes(tekuci)) opcije.push(tekuci);
  opcije.sort();
  opcije.forEach(m=>{
    const o=document.createElement("option");
    o.value=m; o.textContent=formatMesec(m)+(nep.includes(m)?" ⚠️":"");
    sel.appendChild(o);
  });
  // Default: tekuci mesec ako postoji, inace prvi neplaceni
  if(opcije.includes(tekuci)) sel.value=tekuci;
  else if(opcije.length) sel.value=opcije[0];
}

function openUplata(pid){
  uplataPorodicaId=pid;
  const uk=getUkupnoP(pid);
  document.getElementById("modal-uplata-title").textContent="Uplata — "+getNazivP(pid);
  document.getElementById("uplata-rec").textContent=fmt(uk);
  document.getElementById("u-iznos").value=uk;
  document.getElementById("u-datum").value=todayStr();
  document.getElementById("u-napomena").value="";
  buildMesecSelect(pid);
  openModal("modal-uplata");
}

async function sacuvajUplatu(){
  if(saving) return;
  const iznos=parseInt(document.getElementById("u-iznos").value);
  const datum=document.getElementById("u-datum").value;
  const nap=document.getElementById("u-napomena").value.trim();
  const zaMesec=document.getElementById("u-mesec").value;
  if(!iznos||!datum||!zaMesec){toast("Unesite iznos, datum i mesec!","err");return;}
  saving=true; setSync("loading");
  try {
    const nov=await supa("uplate",{method:"POST",body:{porodica_id:uplataPorodicaId,datum,iznos,napomena:nap||null,za_mesec:zaMesec}});
    uplate.unshift(nov[0]);
    toast("Uplata zabeležena ✓");
    closeModal("modal-uplata"); setSync("ok"); render();
  } catch(e){ toast("Greška: "+(e.message||"").slice(0,80),"err"); setSync("err"); }
  saving=false;
}

async function obrisiUplatu(id){
  if(!confirm("Obrisati ovu uplatu?")) return;
  setSync("loading");
  try {
    await supa(`uplate?id=eq.${id}`,{method:"DELETE",prefer:"return=minimal"});
    uplate=uplate.filter(u=>u.id!==id);
    toast("Uplata obrisana"); setSync("ok"); render();
  } catch(e){ toast("Greška!","err"); setSync("err"); }
}

// ═══════════════════════════════════════════
// MAIN
// ═══════════════════════════════════════════
function render(){
  if(currentPage==="dashboard")   renderDashboard();
  if(currentPage==="clanovi")     renderClanovi();
  if(currentPage==="uplate")      renderUplate();
  if(currentPage==="projekcije")  renderProjekcije();
}

document.getElementById("page-dashboard").innerHTML=loading();
loadAll();
</script>
