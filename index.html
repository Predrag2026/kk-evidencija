<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="BB Basket"/>
<title>KK BB Basket Mladenovac</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0f1a;font-family:'DM Sans',sans-serif;color:#e2e8f0;max-width:480px;margin:0 auto;min-height:100vh}
input,select,button,textarea{font-family:'DM Sans',sans-serif}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#e85d2644;border-radius:2px}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.5)}
select option{background:#1a1f2e;color:#e2e8f0}
.page{display:none;padding:16px 16px 90px;animation:fadeIn 0.2s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.header{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e85d2622;position:sticky;top:0;z-index:10}
.logo-box{border-radius:12px;padding:9px;display:flex;flex-shrink:0;cursor:pointer;transition:transform 0.15s}
.logo-box:active{transform:scale(0.92)}
.app-title{color:#f1f5f9;font-family:'Outfit',sans-serif;font-weight:800;font-size:14px;letter-spacing:-0.02em}
.app-sub{color:#64748b;font-size:11px}
@keyframes ballBounce{0%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-120px) rotate(180deg)}50%{transform:translateY(-30px) rotate(270deg)}75%{transform:translateY(-90px) rotate(340deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes ballSlide{0%{left:-60px;top:40px;opacity:1}40%{left:50%;top:-20px}60%{left:50%;top:-20px}100%{left:110%;top:40px;opacity:0}}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#0d9488;margin-left:auto;flex-shrink:0}
.sync-dot.err{background:#dc2626}
.sync-dot.loading{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(11,15,26,0.96);border-top:1px solid #e85d2622;display:flex;padding:7px 0 14px;z-index:100;backdrop-filter:blur(12px)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:5px 0;color:#475569;font-size:10px;font-weight:600;transition:color 0.15s;position:relative}
.nav-btn.active{color:#e85d26}
.nav-btn.active::after{content:'';position:absolute;bottom:-7px;width:24px;height:3px;background:linear-gradient(90deg,#e85d26,#f97316);border-radius:2px 2px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:linear-gradient(135deg,#1a1f2e,#151929);border:1px solid #2d3650;border-radius:16px;padding:16px;position:relative;overflow:hidden;transition:transform 0.15s,border-color 0.15s}
.card:active{transform:scale(0.98)}
.card-accent{position:absolute;top:0;right:0;width:80px;height:80px;opacity:0.1;border-radius:0 16px 0 80px}
.card-icon{border-radius:8px;padding:6px;display:inline-flex;margin-bottom:10px}
.card-label{color:#64748b;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px}
.card-val{color:#f1f5f9;font-size:22px;font-family:'Outfit',sans-serif;font-weight:700;line-height:1}
.card-sub{color:#64748b;font-size:11px;margin-top:4px}
.section{background:linear-gradient(135deg,#1a1f2e,#151929);border:1px solid #2a3048;border-radius:16px;padding:16px;margin-bottom:14px}
.section-title{color:#94a3b8;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:13px}
.member-card{background:linear-gradient(135deg,#1a1f2e,#151929);border:1px solid #2a3048;border-radius:14px;padding:13px;margin-bottom:8px;transition:border-color 0.2s,transform 0.15s}
.member-card:active{transform:scale(0.99)}
.badge{padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;display:inline-block}
.badge-green{background:#0d948822;color:#0d9488}
.badge-yellow{background:#d9770622;color:#d97706}
.badge-red{background:#dc262622;color:#dc2626}
.badge-blue{background:#3b82f622;color:#3b82f6}
.badge-amber{background:#f59e0b22;color:#f59e0b}
.btn-row{display:flex;gap:4px;margin-left:8px;flex-shrink:0}
.icon-btn{border:none;border-radius:7px;padding:7px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon-btn-green{background:#0d948822}
.icon-btn-blue{background:#3b82f622}
.icon-btn-red{background:#dc262622}
.main-btn{width:100%;border:none;border-radius:12px;padding:13px;color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:'Outfit',sans-serif;margin-top:6px;transition:transform 0.15s,opacity 0.15s}
.main-btn:active{transform:scale(0.98);opacity:0.9}
.btn-orange{background:linear-gradient(135deg,#e85d26,#c2410c);box-shadow:0 4px 14px #e85d2640}
.btn-teal{background:linear-gradient(135deg,#0d9488,#0f766e);box-shadow:0 4px 14px #0d948840}
.input-field{width:100%;background:#0f1320;border:1px solid #2d3650;border-radius:10px;padding:11px 14px;color:#e2e8f0;font-size:14px;outline:none;box-sizing:border-box}
.input-field:focus{border-color:#e85d26}
.field-label{display:block;color:#94a3b8;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px}
.field-wrap{margin-bottom:13px}
.overlay{display:none;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{background:#1a1f2e;border:1px solid #2d3650;border-radius:16px;padding:22px;width:100%;max-width:460px;max-height:92vh;overflow-y:auto;position:relative}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{color:#f1f5f9;font-size:17px;font-family:'Outfit',sans-serif;font-weight:700}
.close-btn{background:none;border:none;cursor:pointer;color:#64748b;padding:2px}
.search-wrap{position:relative;margin-bottom:9px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%)}
.search-input{padding-left:36px!important}
.filter-row{display:flex;gap:6px;margin-bottom:13px;flex-wrap:wrap}
.filter-btn{padding:5px 12px;border-radius:20px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:#1a1f2e;color:#64748b}
.filter-btn.active{background:#e85d26;color:#fff}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.page-title{color:#f1f5f9;font-size:22px;font-family:'Outfit',sans-serif;font-weight:700;margin:0}
.add-btn{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,#e85d26,#c2410c);border:none;border-radius:10px;padding:9px 14px;color:#fff;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 12px #e85d2640;transition:transform 0.15s,box-shadow 0.15s}
.add-btn:active{transform:scale(0.96);box-shadow:0 2px 6px #e85d2440}
.bar-wrap{background:#0f1320;border-radius:4px;height:5px;margin-top:5px}
.bar{background:linear-gradient(90deg,#e85d26,#f97316);height:100%;border-radius:4px}
.row-sep{padding:10px 0;border-bottom:1px solid #2d3650;display:flex;justify-content:space-between;align-items:center}
.row-sep:last-child{border-bottom:none}
.nova-box{background:#0f1320;border:1px solid #2d3650;border-radius:11px;padding:13px;margin-bottom:13px}
.price-prev{border-radius:11px;padding:12px 14px;margin-bottom:13px;display:flex;justify-content:space-between;align-items:center}
.dospelo-box{background:#1a1f2e;border:1px solid #dc262644;border-radius:14px;padding:16px;margin-bottom:14px}
.empty{text-align:center;color:#475569;padding:40px 0;font-size:14px}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px}
.spinner{width:36px;height:36px;border:3px solid #2d3650;border-top-color:#e85d26;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1f2e;border:1px solid #2d3650;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;z-index:2000;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.toast.ok{border-color:#0d948866;color:#0d9488}
.toast.err{border-color:#dc262666;color:#dc2626}
.mesec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:13px}
.mesec-btn{padding:8px 4px;border-radius:8px;border:1px solid #2d3650;background:#0f1320;color:#94a3b8;font-size:12px;font-weight:600;cursor:pointer;text-align:center}
.mesec-btn.placen{background:#0d948822;border-color:#0d948866;color:#0d9488}
.mesec-btn.selected{background:#e85d2622;border-color:#e85d26;color:#e85d26}
.mesec-btn.disabled{opacity:0.3;cursor:not-allowed}
.dug-chip{display:inline-block;background:#dc262618;border:1px solid #dc262644;color:#dc2626;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;margin:2px}
.ok-chip{display:inline-block;background:#0d948818;border:1px solid #0d948844;color:#0d9488;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;margin:2px}
.porodica-search-wrap{position:relative;margin-bottom:6px}
.porodica-dropdown{background:#0f1320;border:1px solid #2d3650;border-radius:10px;max-height:180px;overflow-y:auto;display:none;position:absolute;width:100%;z-index:500;top:calc(100% + 4px);left:0}
.porodica-dropdown.open{display:block}
.porodica-item{padding:10px 14px;cursor:pointer;font-size:14px;color:#e2e8f0;border-bottom:1px solid #1e2536}
.porodica-item:last-child{border-bottom:none}
.porodica-item:hover,.porodica-item.active{background:#e85d2618;color:#e85d26}
.porodica-selected{background:#0f1320;border:1px solid #e85d2666;border-radius:10px;padding:11px 14px;color:#e2e8f0;font-size:14px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>

<!-- Animirana lopta u pozadini -->
<div id="ball-anim" style="position:fixed;pointer-events:none;z-index:5;display:none">
  <svg id="ball-svg" width="40" height="40" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="18" fill="#e85d26" opacity="0.9"/>
    <path d="M4 20 Q20 8 36 20" stroke="#c2410c" stroke-width="2" fill="none"/>
    <path d="M4 20 Q20 32 36 20" stroke="#c2410c" stroke-width="2" fill="none"/>
    <line x1="20" y1="2" x2="20" y2="38" stroke="#c2410c" stroke-width="2"/>
  </svg>
</div>

<div class="header" style="background:linear-gradient(135deg,#0f1320 0%,#1a1f2e 100%);border-bottom:1px solid #e85d2633">
  <div class="logo-box" style="background:linear-gradient(135deg,#e85d26,#c2410c);box-shadow:0 4px 14px #e85d2644" onclick="animateBall()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M4.93 4.93c4.08 4.08 4.08 10.66 0 14.74"/>
      <path d="M19.07 4.93c-4.08 4.08-4.08 10.66 0 14.74"/>
      <line x1="2" y1="12" x2="22" y2="12"/>
    </svg>
  </div>
  <div style="flex:1;min-width:0">
    <div class="app-title" style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">KK BB Basket Mladenovac</div>
    <div class="app-sub">Mlađe kategorije</div>
  </div>
  <div id="sync-dot" class="sync-dot loading"></div>
</div>

<div id="page-dashboard" class="page active"></div>
<div id="page-clanovi" class="page"></div>
<div id="page-uplate" class="page"></div>
<div id="page-projekcije" class="page"></div>
<div id="page-izvestaj" class="page"></div>

<nav class="bottom-nav">
  <button class="nav-btn active" onclick="goTo('dashboard')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M4.93 4.93c4.08 4.08 4.08 10.66 0 14.74"/><path d="M19.07 4.93c-4.08 4.08-4.08 10.66 0 14.74"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
    Pregled
  </button>
  <button class="nav-btn" onclick="goTo('clanovi')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Članovi
  </button>
  <button class="nav-btn" onclick="goTo('uplate')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
    Uplate
  </button>
  <button class="nav-btn" onclick="goTo('projekcije')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
    Projekcije
  </button>
  <button class="nav-btn" onclick="goTo('izvestaj')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    Izveštaj
  </button>
</nav>

<!-- MODAL: Dodaj/Uredi člana -->
<div id="modal-clan" class="overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-clan-title">Novi član</span>
      <button class="close-btn" onclick="closeModal('modal-clan')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="field-wrap"><label class="field-label">Ime i prezime *</label><input class="input-field" id="f-ime" type="text" placeholder="npr. Nikola Petrović"/></div>
    <div class="field-wrap"><label class="field-label">Datum rođenja</label><input class="input-field" id="f-datum" type="date"/></div>
    <div class="field-wrap"><label class="field-label">Datum prvog treninga *</label><input class="input-field" id="f-trening" type="date" onchange="updatePrev()"/></div>
    <div class="field-wrap"><label class="field-label">Kategorija</label>
      <select class="input-field" id="f-kat"><option>U8/Minibasket</option><option>U10</option><option>U12</option><option>U14</option></select>
    </div>
    <div class="field-wrap"><label class="field-label">Kontakt roditelja</label><input class="input-field" id="f-tel" type="text" placeholder="06x-xxx-xxxx"/></div>
    <div class="field-wrap" style="position:relative">
      <label class="field-label">Porodica *</label>
      <div class="porodica-search-wrap">
        <input class="input-field" id="f-porodica-search" type="text" placeholder="Pretraži porodicu..." autocomplete="off"
          oninput="filterPorodicaDropdown('f')"
          onfocus="openPorodicaDropdown('f')"
          style="padding-right:36px"/>
        <div id="f-porodica-clear" onclick="clearPorodicaSearch('f')" style="display:none;position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#64748b">✕</div>
      </div>
      <div class="porodica-dropdown" id="f-porodica-dropdown"></div>
      <input type="hidden" id="f-porodica" value=""/>
    </div>
    <div id="nova-box" class="nova-box" style="display:none">
      <div style="color:#64748b;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:11px">Nova porodica</div>
      <div class="field-wrap"><label class="field-label">Prezime</label><input class="input-field" id="f-prezime" type="text" oninput="updatePrev()"/></div>
      <div class="field-wrap"><label class="field-label">Ime roditelja</label><input class="input-field" id="f-imerod" type="text" oninput="updatePrev()"/></div>
      <div id="nova-hint" style="color:#64748b;font-size:12px;margin-top:-4px"></div>
    </div>
    <div id="price-prev" style="display:none" class="price-prev">
      <div><div id="pr-red" style="font-size:11px;font-weight:600;text-transform:uppercase;color:#94a3b8"></div>
      <div id="pr-note" style="font-size:12px;color:#cbd5e1;margin-top:2px"></div></div>
      <div id="pr-val" style="font-family:'Outfit',sans-serif;font-weight:800;font-size:19px"></div>
    </div>
    <button class="main-btn btn-orange" id="modal-clan-btn" onclick="sacuvajClana()">Dodaj člana</button>
  </div>
</div>

<!-- MODAL: Uplata -->
<div id="modal-uplata" class="overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Nova uplata</span>
      <button class="close-btn" onclick="closeModal('modal-uplata')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>

    <!-- Porodica -->
    <div class="field-wrap" style="position:relative">
      <label class="field-label">Porodica *</label>
      <div class="porodica-search-wrap">
        <input class="input-field" id="u-porodica-search" type="text" placeholder="Pretraži porodicu..." autocomplete="off"
          oninput="filterPorodicaDropdown('u')"
          onfocus="openPorodicaDropdown('u')"
          style="padding-right:36px"/>
        <div id="u-porodica-clear" onclick="clearPorodicaSearch('u')" style="display:none;position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#64748b">✕</div>
      </div>
      <div class="porodica-dropdown" id="u-porodica-dropdown"></div>
      <input type="hidden" id="u-porodica" value=""/>
    </div>

    <!-- Iznos -->
    <div class="field-wrap">
      <label class="field-label">Iznos uplate (RSD) *</label>
      <input class="input-field" id="u-iznos" type="number" min="0" oninput="onUplataIznosChange()"/>
    </div>

    <!-- Preporuceni iznos -->
    <div id="u-preporuka" style="display:none;background:#0d948818;border:1px solid #0d948844;border-radius:10px;padding:10px 14px;margin-bottom:13px">
      <div style="color:#64748b;font-size:11px;font-weight:600;text-transform:uppercase;margin-bottom:2px">Preporučeni iznos</div>
      <div id="u-preporuka-val" style="color:#0d9488;font-size:18px;font-weight:800;font-family:'Outfit',sans-serif"></div>
      <div style="color:#475569;font-size:11px;margin-top:1px">Zbir mesečnih iznosa sve dece</div>
    </div>

    <!-- Neplaćeni meseci — višestruki odabir -->
    <div id="u-meseci-box" style="display:none">
      <label class="field-label" style="margin-bottom:8px">Odaberi mesec/mesece *</label>
      <div id="u-meseci-lista" style="display:flex;flex-direction:column;gap:6px;margin-bottom:13px"></div>
      <!-- Višak — ako iznos prelazi dugovanje odabranih meseci -->
      <div id="u-visak-box" style="display:none;background:#f59e0b18;border:1px solid #f59e0b44;border-radius:10px;padding:10px 14px;margin-bottom:13px">
        <div style="color:#f59e0b;font-size:12px;font-weight:600">Iznos prelazi dugovanje za odabrane mesece</div>
        <div id="u-visak-val" style="color:#f59e0b;font-size:13px;font-weight:700;margin-top:2px"></div>
      </div>
    </div>

    <!-- Datum -->
    <div class="field-wrap">
      <label class="field-label">Datum uplate</label>
      <input class="input-field" id="u-datum" type="date"/>
    </div>

    <!-- Napomena -->
    <div class="field-wrap">
      <label class="field-label">Napomena (opciono)</label>
      <input class="input-field" id="u-napomena" type="text" placeholder="Slobodan tekst..."/>
    </div>

const SUPA_URL = "https://bhelrnjbxfhvpidxlebi.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJoZWxybmpieGZodnBpZHhsZWJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNTY1NjEsImV4cCI6MjA5MDYzMjU2MX0.yY8REVGgMDvLYV9LTt9q0td5bApCJuPhIhR8GIuQGig";

async function supa(path, opts={}) {
  const res = await fetch(SUPA_URL + "/rest/v1/" + path, {
    headers: {
      "apikey": SUPA_KEY,
      "Authorization": "Bearer " + SUPA_KEY,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=representation",
      ...opts.headers
    },
    method: opts.method || "GET",
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const txt = await res.text();
  if (!res.ok) {
    let msg = txt;
    try { const j=JSON.parse(txt); msg=j.message||j.hint||j.details||txt; } catch(e){}

// KONSTANTE & HELPERS

const KATEGORIJE = ["U8/Minibasket","U10","U12","U14"];
const CLANARINA  = {1:3200, 2:2400};
const MESECI_SR  = ["Januar","Februar","Mart","April","Maj","Jun","Jul","Avgust","Septembar","Oktobar","Novembar","Decembar"];
const MESECI_KR  = ["Jan","Feb","Mar","Apr","Maj","Jun","Jul","Avg","Sep","Okt","Nov","Dec"];

function getClanarina(n){ return n>=3?0:(CLANARINA[n]??0); }
function getBrojDece(pid, izuzmiId=null){ return clanovi.filter(c=>c.porodica_id===pid&&c.id!==izuzmiId).length; }
function slugify(s){ return(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"dj").replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,""); }
function fmt(n){ return(n??0).toLocaleString("sr-RS")+" RSD"; }
function todayStr(){ return new Date().toISOString().split("T")[0]; }
function getNazivP(pid){ return(porodice.find(x=>x.id===pid)||{naziv:pid}).naziv; }
function getUkupnoP(pid){ return clanovi.filter(c=>c.porodica_id===pid).reduce((s,c)=>s+c.iznos,0); }
function getDecaP(pid){ return clanovi.filter(c=>c.porodica_id===pid); }

// Vraca string "YYYY-MM" za godinu/mesec
function ym(year, month){ return year+"-"+String(month+1).padStart(2,"0"); }

// Svi meseci od datuma prvog treninga do tekuceg meseca (ukljucujuci oba)
function getMesecOd(datumTreninga){
  if(!datumTreninga) return [];
  const start = new Date(datumTreninga);
  const now = new Date();
  const result = [];
  let y = start.getFullYear(), m = start.getMonth();
  while(y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth())){
    result.push(ym(y,m));
    m++; if(m>11){m=0;y++;}
  }
  return result;
}

// Placeni meseci za porodicu (iz uplata)
function getPlaceniMeseci(pid){
  return uplate.filter(u=>u.porodica_id===pid&&u.za_mesec).map(u=>u.za_mesec);
}

// Neplaceni meseci za konkretno dete (nezavisno od ostale dece)
function getNeplaceniMeseciDeteta(dete){
  if(!dete.datum_treninga) return [];
  const placeni = getPlaceniMeseci(dete.porodica_id);
  const meseciDeteta = getMesecOd(dete.datum_treninga);
  return meseciDeteta.filter(m => !placeni.includes(m));
}

// Neplaceni meseci za porodicu = unija neplacenih meseci sve dece
function getNeplaceniMeseci(pid){
  const deca = getDecaP(pid);
  if(!deca.length) return [];
  const dugSet = new Set();
  deca.forEach(dete => {
    getNeplaceniMeseciDeteta(dete).forEach(m => dugSet.add(m));
  });
  return [...dugSet].sort();
}

// Status pojedinacnog deteta
function getStatusDeteta(dete){
  const nep = getNeplaceniMeseciDeteta(dete);
  if(!nep.length) return {cls:"badge-green", label:"Plaćeno"};
  if(nep.length===1) return {cls:"badge-yellow", label:"1 mes. dug"};
  return {cls:"badge-red", label:nep.length+" mes. dug"};
}

// Status porodice (za dashboard)
function getStatus(pid){
  const nep = getNeplaceniMeseci(pid);
  if(!nep.length) return {cls:"badge-green", label:"Plaćeno"};
  if(nep.length===1) return {cls:"badge-yellow", label:"1 mes. dug"};
  return {cls:"badge-red", label:nep.length+" mes. dug"};
}

  const i={

    payment:`<svg ${s}><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>`,
    chart:`<svg ${s}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>`,

    plus:`<svg ${s} stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
    trash:`<svg ${s}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
    edit:`<svg ${s}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
    search:`<svg ${s}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
    trend:`<svg ${s}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,
    family:`<svg ${s}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
    check:`<svg ${s} stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`
  };
  return i[name]||"";
}

    html+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="color:#64748b;font-size:10px">${m.iznos>0?Math.round(m.iznos/1000)+"k":""}</div>
      <div style="width:100%;background:linear-gradient(180deg,#e85d26,#c2410c);border-radius:4px 4px 0 0;height:${h}px;min-height:${m.iznos>0?5:0}px"></div>
      <div style="color:#64748b;font-size:10px">${m.mesec}</div>
    </div>`;
  });
  html+=`</div></div><div class="section"><div class="section-title">Po kategoriji</div>`;
  KATEGORIJE.forEach(k=>{
    const cK=clanovi.filter(c=>c.kategorija===k);
    const aktK=cK.filter(c=>!getNeplaceniMeseci(c.porodica_id).includes(tekuciMesec));
    const pr=cK.reduce((s,c)=>s+c.iznos,0);
    html+=`<div class="row-sep">
      <div><div style="color:#e2e8f0;font-size:14px;font-weight:600">${k}</div>
      <div style="color:#64748b;font-size:12px">${aktK.length}/${cK.length} platilo ovaj mes.</div></div>
      <div style="text-align:right">
        <div style="color:#e85d26;font-weight:700;font-size:13px">${fmt(pr)}/mes</div>
        <div style="color:#64748b;font-size:11px">${fmt(pr*12)}/god</div>
      </div>
    </div>`;
  });
  html+=`</div>`;
  document.getElementById("page-projekcije").innerHTML=html;
}

async function sacuvajClana(){
  if(saving) return;
  const ime=document.getElementById("f-ime").value.trim();
  const datum=document.getElementById("f-datum").value;
  const trening=document.getElementById("f-trening").value;
  const kat=document.getElementById("f-kat").value;
  const tel=document.getElementById("f-tel").value.trim();
  const pidSel=document.getElementById("f-porodica").value;
  if(!ime||!pidSel||!trening){toast("Unesite ime, datum treninga i porodicu!","err");return;}

  saving=true; setSync("loading");
  try {
    let fPid=pidSel;
    if(pidSel==="__nova__"){
      const prez=document.getElementById("f-prezime").value.trim();
      const imed=document.getElementById("f-imerod").value.trim();
      if(!prez||!imed){toast("Unesite prezime i ime roditelja!","err");saving=false;return;}
      fPid=slugify(prez+"_"+imed);
      if(!porodice.find(p=>p.id===fPid)){
        const np=await supa("porodice",{method:"POST",body:{id:fPid,naziv:`${prez} — ${imed}`}});
        porodice.push(np[0]);
      }
    }
    const br=getBrojDece(fPid,editingId)+1;
    const iznos=getClanarina(br);
    const data={ime,datum_rodjenja:datum||null,datum_treninga:trening,kategorija:kat,tel:tel||null,porodica_id:fPid,r_br:br,iznos};
    if(editingId){
      const upd=await supa(`clanovi?id=eq.${editingId}`,{method:"PATCH",body:data});
      const idx=clanovi.findIndex(c=>c.id===editingId);
      if(idx>-1) clanovi[idx]={...clanovi[idx],...upd[0]};
      toast("Član ažuriran ✓");
    } else {
      const nov=await supa("clanovi",{method:"POST",body:data});
      clanovi.push(nov[0]);
      clanovi.sort((a,b)=>a.ime.localeCompare(b.ime));
      toast("Član dodat ✓");
    }
    closeModal("modal-clan"); setSync("ok"); render();
  } catch(e){ toast("Greška: "+(e.message||"").slice(0,80),"err"); setSync("err"); }
  saving=false;
}

async function obrisiClana(id){
  if(!confirm("Obrisati ovog člana?")) return;
  setSync("loading");
  try {
    await supa(`clanovi?id=eq.${id}`,{method:"DELETE",prefer:"return=minimal"});
    clanovi=clanovi.filter(c=>c.id!==id);
    toast("Član obrisan"); setSync("ok"); render();
  } catch(e){ toast("Greška!","err"); setSync("err"); }
}

function openPorodicaDropdown(prefix){
  filterPorodicaDropdown(prefix);
  document.getElementById(prefix+"-porodica-dropdown").classList.add("open");
  document.addEventListener("click", function handler(e){
    const wrap=document.getElementById(prefix+"-porodica-dropdown");
    const inp=document.getElementById(prefix+"-porodica-search");
    if(!wrap.contains(e.target)&&e.target!==inp){
      wrap.classList.remove("open");
      document.removeEventListener("click",handler);
    }
  });
}

function filterPorodicaDropdown(prefix){
  const q=(document.getElementById(prefix+"-porodica-search").value||"").toLowerCase();
  const dd=document.getElementById(prefix+"-porodica-dropdown");
  const selPid=document.getElementById(prefix+"-porodica").value;
  // Opcija "Nova porodica" samo za f- (dodaj clan modal)
  const showNova = prefix==="f";
  const sve=[...porodice];
  const filtered=q?sve.filter(p=>p.naziv.toLowerCase().includes(q)):sve;
  dd.innerHTML="";
  if(!filtered.length&&!showNova){
    dd.innerHTML=`<div class="porodica-item" style="color:#64748b">Nema rezultata</div>`;
    return;
  }
  filtered.forEach(p=>{
    const div=document.createElement("div");
    div.className="porodica-item"+(p.id===selPid?" active":"");
    div.textContent=p.naziv;
    div.onclick=()=>selectPorodica(prefix,p.id,p.naziv);
    dd.appendChild(div);
  });
  if(showNova){
    const div=document.createElement("div");
    div.className="porodica-item";
    div.style.color="#e85d26";
    div.textContent="+ Nova porodica";
    div.onclick=()=>selectPorodica(prefix,"__nova__","+ Nova porodica");
    dd.appendChild(div);
  }
}

function getMeseciPorodice(pid){
  // Za svaki mesec: lista dece koja ga duguju i ukupan iznos
  const deca=getDecaP(pid);
  const placeni=getPlaceniMeseci(pid);
  const danas=new Date();
  const tekuci=ym(danas.getFullYear(),danas.getMonth());
  const mesMap={};

  deca.forEach(dete=>{
    if(!dete.datum_treninga) return;
    const meseciDeteta=getMesecOd(dete.datum_treninga);
    meseciDeteta.forEach(mes=>{
      if(!mesMap[mes]) mesMap[mes]={placen:placeni.includes(mes), deca:[], iznos:0};
      mesMap[mes].deca.push(dete);
      mesMap[mes].iznos+=dete.iznos;
    });
  });

  // Vrati samo neplacene + tekuci (ako postoji za bilo koje dete)
  return Object.entries(mesMap)
    .filter(([mes, info])=> !info.placen || mes===tekuci)
    .filter(([mes, info])=> !info.placen) // samo neplacene
    .sort(([a],[b])=>a.localeCompare(b))
    .map(([mes, info])=>({mes, ...info}));
}

function renderMeseciLista(pid){
  const opcije=getMeseciPorodice(pid);
  const lista=document.getElementById("u-meseci-lista");
  lista.innerHTML="";

  if(!opcije.length){
    lista.innerHTML=`<div style="color:#0d9488;font-size:13px;padding:8px 0">✓ Sve članarine su plaćene</div>`;
    return;
  }

  opcije.forEach(({mes, deca: decaMes, iznos: iznosMes})=>{
    const label=formatMesec(mes);
    const checked=odabraniMeseci.includes(mes);
    const decaOpis=decaMes.map(d=>d.ime.split(" ")[0]).join(", ");

    const div=document.createElement("div");
    div.style.cssText=`display:flex;align-items:center;justify-content:space-between;background:${checked?"#e85d2618":"#0f1320"};border:1px solid ${checked?"#e85d2666":"#2d3650"};border-radius:10px;padding:11px 14px;cursor:pointer;transition:all 0.15s`;
    div.onclick=()=>toggleMesec(mes,pid);
    div.innerHTML=`
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:18px;height:18px;border-radius:5px;border:2px solid ${checked?"#e85d26":"#475569"};background:${checked?"#e85d26":"transparent"};display:flex;align-items:center;justify-content:center;flex-shrink:0">
          ${checked?`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`:""}
        </div>
        <div>
          <div style="color:#e2e8f0;font-size:14px;font-weight:600">${label}</div>
          <div style="font-size:11px;color:#dc2626">⚠️ ${decaOpis}</div>
        </div>
      </div>
      <div style="color:#e85d26;font-weight:700;font-size:14px">${fmt(iznosMes)}</div>`;
    lista.appendChild(div);
  });
}

function toggleMesec(mes, pid){
  if(odabraniMeseci.includes(mes)){
    odabraniMeseci=odabraniMeseci.filter(m=>m!==mes);
  } else {
    odabraniMeseci.push(mes);
  }
  renderMeseciLista(pid);
  updateVisak();
}

function onUplataIznosChange(){ updateVisak(); }

function updateVisak(){
  const pid=document.getElementById("u-porodica").value||uplataPorodicaId;
  if(!pid||!odabraniMeseci.length){
    document.getElementById("u-visak-box").style.display="none";
    return;
  }
  const iznos=parseInt(document.getElementById("u-iznos").value)||0;
  // Izracunaj stvarno dugovanje za svaki odabrani mesec
  const sveMeseci=getMeseciPorodice(pid);
  const dugZaOdabrane=odabraniMeseci.reduce((s,mes)=>{
    const info=sveMeseci.find(x=>x.mes===mes);
    return s+(info?info.iznos:0);
  },0);
  const visak=iznos-dugZaOdabrane;
  if(visak>0){
    document.getElementById("u-visak-box").style.display="block";
    document.getElementById("u-visak-val").textContent=`Višak: ${fmt(visak)} · Dugovanje: ${fmt(dugZaOdabrane)} za ${odabraniMeseci.length} ${odabraniMeseci.length===1?"mesec":"meseca"}`;
  } else {
    document.getElementById("u-visak-box").style.display="none";
  }
}

async function sacuvajUplatu(){
  if(saving) return;
  const pid=document.getElementById("u-porodica").value||uplataPorodicaId;
  const iznos=parseInt(document.getElementById("u-iznos").value);
  const datum=document.getElementById("u-datum").value;
  const nap=document.getElementById("u-napomena").value.trim();
  if(!pid){toast("Izaberite porodicu!","err");return;}
  if(!iznos||!datum){toast("Unesite iznos i datum!","err");return;}
  if(!odabraniMeseci.length){toast("Odaberite bar jedan mesec!","err");return;}

  saving=true; setSync("loading");
  try {
    // Kreiraj jednu uplatu po odabranom mesecu sa stvarnim iznosom po mesecu
    const sveMeseci=getMeseciPorodice(pid);
    const sortirani=[...odabraniMeseci].sort();
    let preostalo=iznos;
    for(let i=0;i<sortirani.length;i++){
      const info=sveMeseci.find(x=>x.mes===sortirani[i]);
      const mesIznos = i===sortirani.length-1 ? preostalo : (info?info.iznos:Math.round(iznos/sortirani.length));
      preostalo-=mesIznos;
      const nov=await supa("uplate",{method:"POST",body:{porodica_id:pid,datum,iznos:mesIznos,napomena:nap||null,za_mesec:sortirani[i]}});
      uplate.unshift(nov[0]);
    }
    toast(`Uplata zabeležena ✓ (${sortirani.length} ${sortirani.length===1?"mesec":"meseca"})`);
    closeModal("modal-uplata"); setSync("ok"); render();
  } catch(e){ toast("Greška: "+(e.message||"").slice(0,80),"err"); setSync("err"); }
  saving=false;
}

async function obrisiUplatu(id){
  if(!confirm("Obrisati ovu uplatu?")) return;
  setSync("loading");
  try {
    await supa(`uplate?id=eq.${id}`,{method:"DELETE",prefer:"return=minimal"});
    uplate=uplate.filter(u=>u.id!==id);
    toast("Uplata obrisana"); setSync("ok"); render();
  } catch(e){ toast("Greška!","err"); setSync("err"); }
}

let izvKat="Sve", izvStatus="Svi", izvMesec="", izvPorodicaOn=false, izvPorodicaId="";

function initIzvMesec(){
  // Podesi default mesec na tekuci
  if(!izvMesec){
    const d=new Date();
    izvMesec=ym(d.getFullYear(),d.getMonth());
  }
}

function renderIzvestajLista(){
  const page=document.getElementById("page-izvestaj");
  const listaEl=page.querySelector("#izvestaj-lista");
  if(!listaEl) return;
  initIzvMesec();

  const filtered = clanovi.filter(c => {
    if(izvKat!=="Sve" && c.kategorija!==izvKat) return false;
    if(izvPorodicaOn && izvPorodicaId && c.porodica_id!==izvPorodicaId) return false;
    if(izvStatus!=="Svi"){
      const placeni = getPlaceniMeseci(c.porodica_id);
      const aktivan = c.datum_treninga && getMesecOd(c.datum_treninga).includes(izvMesec);
      if(!aktivan) return false;
      const placenTajMesec = placeni.includes(izvMesec);
      if(izvStatus==="Plaćeno" && !placenTajMesec) return false;
      if(izvStatus==="Neplaćeno" && placenTajMesec) return false;
    } else {
      if(!c.datum_treninga) return false;
      if(!getMesecOd(c.datum_treninga).includes(izvMesec)) return false;
    }
    return true;
  });

  const ukupnoIznos = filtered.reduce((s,c)=>s+c.iznos,0);
  const placeni_count = filtered.filter(c=>getPlaceniMeseci(c.porodica_id).includes(izvMesec)).length;

  // Update summary cards
  const summaryEl=page.querySelector("#izvestaj-summary");
  if(summaryEl){
    summaryEl.innerHTML=`
      ${statCard("users","Pronađeno",filtered.length,"dece","#3b82f6")}
      ${statCard("payment","Platilo",placeni_count+" / "+filtered.length,"za izabrani mesec","#0d9488")}`;
  }

  if(!filtered.length){
    listaEl.innerHTML=`<div class="empty">Nema dece za izabrane filtere</div>`;
    return;
  }

  let html="";
  filtered.forEach(c=>{
    const placeni=getPlaceniMeseci(c.porodica_id);
    const placenTajMesec=placeni.includes(izvMesec);
    const iznos=c.iznos===0?`<span style="color:#0d9488;font-weight:700">Besplatno</span>`:fmt(c.iznos);
    const statusChip=placenTajMesec?`<span class="ok-chip">✓ Plaćeno</span>`:`<span class="dug-chip">✗ Neplaćeno</span>`;
    const rB=c.r_br===1?"badge-blue":c.r_br===2?"badge-amber":"badge-green";
    const rT=c.r_br===1?"1. dete":c.r_br===2?"2. dete":"3.+ dete";
    html+=`<div class="member-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px">
            <span style="color:#f1f5f9;font-weight:700;font-size:15px">${c.ime}</span>
            <span class="badge ${rB}">${rT}</span>
          </div>
          <div style="color:#64748b;font-size:12px">${c.kategorija} · ${iznos}</div>
          <div style="color:#475569;font-size:11px;margin-top:2px">👨‍👩‍👦 ${getNazivP(c.porodica_id)}${c.tel?" · "+c.tel:""}</div>
          <div style="margin-top:5px">${statusChip}</div>
        </div>
        <button class="icon-btn icon-btn-green" onclick="openUplata('${c.porodica_id}')" style="margin-left:8px">${svg("payment","#0d9488",14)}</button>
      </div>
    </div>`;
  });

  if(izvStatus==="Neplaćeno"){
    const ukNep=filtered.reduce((s,c)=>s+c.iznos,0);
    html+=`<div style="background:#dc262610;border:1px solid #dc262633;border-radius:12px;padding:14px;margin-top:8px;display:flex;justify-content:space-between;align-items:center">
      <span style="color:#94a3b8;font-size:13px">Ukupno neplaćeno</span>
      <span style="color:#dc2626;font-weight:700;font-size:15px">${fmt(ukNep)}</span>
    </div>`;
  }
  if(izvStatus==="Plaćeno"){
    html+=`<div style="background:#0d948810;border:1px solid #0d948833;border-radius:12px;padding:14px;margin-top:8px;display:flex;justify-content:space-between;align-items:center">
      <span style="color:#94a3b8;font-size:13px">Ukupno naplaćeno</span>
      <span style="color:#0d9488;font-weight:700;font-size:15px">${fmt(ukupnoIznos)}</span>
    </div>`;
  }
  listaEl.innerHTML=html;
}

function renderIzvestaj(){
  initIzvMesec();

  const page=document.getElementById("page-izvestaj");
  // Generiši listu meseci
  const sviDatumi = clanovi.map(c=>c.datum_treninga).filter(Boolean).sort();
  const najraniji = sviDatumi[0];
  const svMeseci = najraniji ? getMesecOd(najraniji) : [];

  // Filtriraj decu (za summary)
  const filtered = clanovi.filter(c => {
    if(izvKat!=="Sve" && c.kategorija!==izvKat) return false;
    if(izvPorodicaOn && izvPorodicaId && c.porodica_id!==izvPorodicaId) return false;
    if(izvStatus!=="Svi"){
      const nep = getNeplaceniMeseciDeteta(c);
      const placeni = getPlaceniMeseci(c.porodica_id);
      const aktivan = c.datum_treninga && getMesecOd(c.datum_treninga).includes(izvMesec);
      if(!aktivan) return false; // dete nije bilo u klubu taj mesec
      const placenTajMesec = placeni.includes(izvMesec);
      if(izvStatus==="Plaćeno" && !placenTajMesec) return false;
      if(izvStatus==="Neplaćeno" && placenTajMesec) return false;
    } else {
      // Kad je "Svi" — prikaži samo decu koja su bila u klubu taj mesec
      if(!c.datum_treninga) return false;
      if(!getMesecOd(c.datum_treninga).includes(izvMesec)) return false;
    }
    return true;
  });

  const html=`
  <div style="margin-bottom:18px"><h2 class="page-title">Izveštaj</h2></div>

  <div class="section" style="margin-bottom:14px">
    <div class="section-title">Filteri</div>
    <div class="field-wrap">
      <label class="field-label">Mesec</label>
      <select class="input-field" onchange="izvMesec=this.value;renderIzvestajLista()">
        ${svMeseci.slice().reverse().map(m=>`<option value="${m}" ${m===izvMesec?"selected":""}>${formatMesec(m)}</option>`).join("")}
      </select>
    </div>
    <div class="field-wrap">
      <label class="field-label">Kategorija</label>
      <select class="input-field" onchange="izvKat=this.value;renderIzvestajLista()">
        ${["Sve",...KATEGORIJE].map(k=>`<option value="${k}" ${k===izvKat?"selected":""}>${k}</option>`).join("")}
      </select>
    </div>
    <div class="field-wrap">
      <label class="field-label">Status naplate</label>
      <select class="input-field" onchange="izvStatus=this.value;renderIzvestajLista()">
        ${["Svi","Plaćeno","Neplaćeno"].map(s=>`<option value="${s}" ${s===izvStatus?"selected":""}>${s}</option>`).join("")}
      </select>
    </div>
    <div class="field-wrap">
      <label class="field-label">Biraj po porodici</label>
      <select class="input-field" onchange="izvPorodicaOn=this.value==='Da';if(!izvPorodicaOn){izvPorodicaId='';renderIzvestaj();}else{renderIzvestaj();}">
        <option value="Ne" ${!izvPorodicaOn?"selected":""}>Ne</option>
        <option value="Da" ${izvPorodicaOn?"selected":""}>Da</option>
      </select>
    </div>
    ${izvPorodicaOn?`<div class="field-wrap" style="margin-bottom:0;position:relative">
      <label class="field-label">Odaberi porodicu</label>
      <div class="porodica-search-wrap">
        <input class="input-field" id="izv-porodica-search" type="text" placeholder="Pretraži porodicu..." autocomplete="off"
          value="${izvPorodicaId?getNazivP(izvPorodicaId):''}"
          oninput="filterPorodicaDropdown('izv')" onfocus="openPorodicaDropdown('izv')" style="padding-right:36px"/>
        <div id="izv-porodica-clear" onclick="clearPorodicaSearch('izv')" style="display:${izvPorodicaId?'block':'none'};position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#64748b">✕</div>
      </div>
      <div class="porodica-dropdown" id="izv-porodica-dropdown"></div>
      <input type="hidden" id="izv-porodica" value="${izvPorodicaId}"/>
    </div>`:""}
  </div>

  <div class="grid2" id="izvestaj-summary" style="margin-bottom:14px"></div>
  <div id="izvestaj-lista"></div>`;

  page.innerHTML=html;
  renderIzvestajLista();
}

function render(){
  if(currentPage==="dashboard")   renderDashboard();
  if(currentPage==="clanovi")     renderClanovi();
  if(currentPage==="uplate")      renderUplate();
  if(currentPage==="projekcije")  renderProjekcije();
  if(currentPage==="izvestaj")    renderIzvestaj();
}

document.getElementById("page-dashboard").innerHTML=loading();
loadAll();
</script>
</body>
</html>
